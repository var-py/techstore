x-test-image: &test-image
  image: ${COMPOSE_PROJECT_NAME}-runner
  build:
    context: .
    dockerfile: tests/Dockerfile

services:
  unit-tests:
    <<: *test-image
    network_mode: none
    volumes:
      - ./test-results/${COMPOSE_PROJECT_NAME}:/reports
    command: python -m pytest tests/unit tests/component -v --junitxml=/reports/fast.xml

  db-test:
    image: postgres:16
    environment:
      POSTGRES_DB: flask_db_test
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_password
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test_user -d flask_db_test"]
      interval: 2s
      timeout: 3s
      retries: 30

  web-test:
    <<: *test-image
    env_file: tests/.env.tests
    depends_on:
      db-test:
        condition: service_healthy
    command:
      - sh
      - -c
      - >-
        python tests/prepare_db.py &&
        exec gunicorn --worker-class gthread --workers 1 --threads 20
        --bind 0.0.0.0:80 app.main:app

  integration-tests:
    <<: *test-image
    env_file: tests/docker.env
    depends_on:
      web-test:
        condition: service_healthy
    volumes:
      - ./test-results/${COMPOSE_PROJECT_NAME}:/reports
    command: python -m pytest tests/integration -v --junitxml=/reports/integration.xml

# Только внутренняя сеть: нет доступа к рабочей Kafka или внешней почте.
networks:
  default:
    internal: true
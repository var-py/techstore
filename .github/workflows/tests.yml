name: Tests and deploy

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Docker tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Run tests in Docker
        run: make test

      - name: Save test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: test-results/**/*.xml
          if-no-files-found: ignore
          retention-days: 7

  deploy:
    name: Deploy production
    needs: tests
    if: >-
      github.ref == 'refs/heads/master' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    concurrency:
      group: techstore-production
      cancel-in-progress: false

    steps:
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SERVER_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Update server
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          ssh -i ~/.ssh/id_ed25519 \
            -p "$SERVER_PORT" \
            "$SERVER_USER@$SERVER_HOST" \
            'bash -se' <<'REMOTE'
          set -eu

          cd /home/techstore
          git fetch origin master
          git pull --ff-only origin master

          docker compose config --quiet
          docker compose up -d --build --remove-orphans
          docker compose ps

          attempt=1
          while [ "$attempt" -le 30 ]; do
              if curl --fail --silent http://127.0.0.1/ > /dev/null; then
                  echo "Application is available"
                  exit 0
              fi
              attempt=$((attempt + 1))
              sleep 2
          done

          echo "Application did not become available" >&2
          docker compose logs --no-color --tail 100 web >&2
          exit 1
          REMOTE
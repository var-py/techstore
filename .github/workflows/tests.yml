name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Docker tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Run tests in Docker
        run: make test
      - name: Save test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: test-results/**/*.xml
          if-no-files-found: ignore
          retention-days: 7
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Заказ успешно отправлен</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --background: #f5f7fb;
            --card-background: #ffffff;
            --primary: #6c5ce7;
            --primary-hover: #5948d8;
            --success: #22c55e;
            --success-light: #dcfce7;
            --text-main: #18181b;
            --text-secondary: #71717a;
            --border: #e4e4e7;
        }

        body {
            min-height: 100vh;
            padding: 20px;

            display: flex;
            align-items: center;
            justify-content: center;

            background:
                radial-gradient(
                    circle at top left,
                    rgba(108, 92, 231, 0.12),
                    transparent 35%
                ),
                radial-gradient(
                    circle at bottom right,
                    rgba(34, 197, 94, 0.1),
                    transparent 35%
                ),
                var(--background);

            color: var(--text-main);
            font-family:
                Inter,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;
        }

        .success-card {
            width: 100%;
            max-width: 520px;
            padding: 48px 40px;

            position: relative;
            overflow: hidden;

            text-align: center;

            background: var(--card-background);
            border: 1px solid rgba(228, 228, 231, 0.8);
            border-radius: 28px;

            box-shadow:
                0 25px 60px rgba(24, 24, 27, 0.09),
                0 8px 24px rgba(24, 24, 27, 0.05);

            animation: cardAppearance 0.65s ease forwards;
        }

        .success-card::before {
            content: "";
            width: 180px;
            height: 180px;

            position: absolute;
            top: -110px;
            right: -80px;

            background: rgba(108, 92, 231, 0.08);
            border-radius: 50%;
        }

        .success-icon-wrapper {
            width: 96px;
            height: 96px;
            margin: 0 auto 28px;

            display: flex;
            align-items: center;
            justify-content: center;

            position: relative;

            background: var(--success-light);
            border-radius: 50%;

            animation: iconAppearance 0.7s 0.2s ease both;
        }

        .success-icon-wrapper::after {
            content: "";
            position: absolute;
            inset: -10px;

            border: 2px solid rgba(34, 197, 94, 0.14);
            border-radius: 50%;

            animation: pulse 2s infinite;
        }

        .success-icon {
            width: 52px;
            height: 52px;
        }

        .success-icon path {
            fill: none;
            stroke: var(--success);
            stroke-width: 3.5;
            stroke-linecap: round;
            stroke-linejoin: round;

            stroke-dasharray: 50;
            stroke-dashoffset: 50;

            animation: drawCheck 0.6s 0.55s ease forwards;
        }

        .status {
            display: inline-flex;
            align-items: center;
            gap: 8px;

            margin-bottom: 16px;
            padding: 7px 13px;

            color: #15803d;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0.03em;
            text-transform: uppercase;

            background: var(--success-light);
            border-radius: 100px;
        }

        .status-dot {
            width: 7px;
            height: 7px;

            background: var(--success);
            border-radius: 50%;
        }

        h1 {
            margin-bottom: 14px;

            font-size: clamp(28px, 6vw, 38px);
            line-height: 1.12;
            letter-spacing: -0.04em;
        }

        .description {
            max-width: 410px;
            margin: 0 auto 28px;

            color: var(--text-secondary);
            font-size: 16px;
            line-height: 1.65;
        }

        .order-info {
            margin-bottom: 30px;
            padding: 18px 20px;

            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;

            text-align: left;

            background: #fafafa;
            border: 1px solid var(--border);
            border-radius: 16px;
        }

        .order-info-label {
            margin-bottom: 4px;

            color: var(--text-secondary);
            font-size: 13px;
        }

        .order-number {
            font-size: 16px;
            font-weight: 700;
        }

        .copy-button {
            min-width: 42px;
            height: 42px;
            padding: 0 13px;

            display: flex;
            align-items: center;
            justify-content: center;
            gap: 7px;

            color: var(--primary);
            font: inherit;
            font-size: 13px;
            font-weight: 700;

            background: #ffffff;
            border: 1px solid var(--border);
            border-radius: 12px;

            cursor: pointer;
            transition:
                transform 0.2s ease,
                border-color 0.2s ease,
                background-color 0.2s ease;
        }

        .copy-button:hover {
            transform: translateY(-2px);
            border-color: var(--primary);
            background: #f8f7ff;
        }

        .copy-button:active {
            transform: translateY(0);
        }

        .actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .button {
            min-height: 52px;
            padding: 14px 20px;

            display: flex;
            align-items: center;
            justify-content: center;

            font: inherit;
            font-size: 15px;
            font-weight: 700;
            text-decoration: none;

            border: none;
            border-radius: 14px;

            cursor: pointer;
            transition:
                transform 0.2s ease,
                background-color 0.2s ease,
                box-shadow 0.2s ease;
        }

        .button:hover {
            transform: translateY(-2px);
        }

        .button-primary {
            color: #ffffff;
            background: var(--primary);

            box-shadow: 0 10px 22px rgba(108, 92, 231, 0.25);
        }

        .button-primary:hover {
            background: var(--primary-hover);
            box-shadow: 0 13px 26px rgba(108, 92, 231, 0.32);
        }

        .button-secondary {
            color: var(--text-main);
            background: #f4f4f5;
        }

        .button-secondary:hover {
            background: #e9e9ec;
        }

        .notification {
            padding: 12px 18px;

            position: fixed;
            left: 50%;
            bottom: 24px;
            z-index: 10;

            color: #ffffff;
            font-size: 14px;
            font-weight: 600;

            background: #18181b;
            border-radius: 12px;

            opacity: 0;
            pointer-events: none;
            transform: translate(-50%, 20px);

            transition:
                opacity 0.3s ease,
                transform 0.3s ease;
        }

        .notification.visible {
            opacity: 1;
            transform: translate(-50%, 0);
        }

        @keyframes cardAppearance {
            from {
                opacity: 0;
                transform: translateY(30px) scale(0.97);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @keyframes iconAppearance {
            from {
                opacity: 0;
                transform: scale(0.5) rotate(-12deg);
            }

            to {
                opacity: 1;
                transform: scale(1) rotate(0);
            }
        }

        @keyframes drawCheck {
            to {
                stroke-dashoffset: 0;
            }
        }

        @keyframes pulse {
            0% {
                opacity: 0.8;
                transform: scale(0.9);
            }

            70% {
                opacity: 0;
                transform: scale(1.18);
            }

            100% {
                opacity: 0;
                transform: scale(1.18);
            }
        }

        @media (max-width: 560px) {
            .success-card {
                padding: 38px 22px 24px;
                border-radius: 22px;
            }

            .success-icon-wrapper {
                width: 84px;
                height: 84px;
            }

            .success-icon {
                width: 46px;
                height: 46px;
            }

            .order-info {
                align-items: flex-start;
            }

            .actions {
                grid-template-columns: 1fr;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                scroll-behavior: auto !important;
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>

<body>
    <main class="success-card">
        <div class="success-icon-wrapper" aria-hidden="true">
            <svg
                class="success-icon"
                viewBox="0 0 52 52"
                xmlns="http://www.w3.org/2000/svg"
            >
                <path d="M14 27L22 35L39 17" />
            </svg>
        </div>

        <div class="status">
            <span class="status-dot"></span>
            Принято
        </div>

        <h1>Заказ успешно отправлен</h1>

        <p class="description">
            Мы получили ваш заказ. Наш специалист проверит информацию
            и свяжется с вами в ближайшее время.
        </p>

        <div class="order-info">
            <div>
                <div class="order-info-label">Номер заказа</div>
                <div class="order-number" id="orderNumber">
                    Загрузка...
                </div>
            </div>

            <button
                class="copy-button"
                id="copyButton"
                type="button"
                aria-label="Скопировать номер заказа"
            >
                Копировать
            </button>
        </div>

        <div class="actions">
            <a class="button button-primary" href="/">
                На главную
            </a>

            <button
                class="button button-secondary"
                id="newOrderButton"
                type="button"
            >
                Новый заказ
            </button>
        </div>
    </main>

    <div
        class="notification"
        id="notification"
        role="status"
        aria-live="polite"
    >
        Номер заказа скопирован
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const orderNumberElement =
                document.getElementById("orderNumber");

            const copyButton =
                document.getElementById("copyButton");

            const newOrderButton =
                document.getElementById("newOrderButton");

            const notification =
                document.getElementById("notification");

            /*
             * Можно заменить генерацию номера заказа
             * на значение, полученное от вашего сервера.
             *
             * Например:
             * const orderNumber = "#IN-123456";
             */
            const orderNumber = generateOrderNumber();

            orderNumberElement.textContent = orderNumber;

            copyButton.addEventListener("click", async () => {
                try {
                    await navigator.clipboard.writeText(orderNumber);
                    showNotification("Номер заказа скопирован");
                } catch (error) {
                    fallbackCopy(orderNumber);
                    showNotification("Номер заказа скопирован");
                }
            });

            newOrderButton.addEventListener("click", () => {
                /*
                 * Укажите здесь адрес страницы
                 * создания нового заказа.
                 */
                window.location.href = "/order";
            });

            function generateOrderNumber() {
                const date = new Date();

                const year = String(date.getFullYear()).slice(-2);
                const month = String(date.getMonth() + 1).padStart(2, "0");
                const day = String(date.getDate()).padStart(2, "0");

                const randomNumber = Math.floor(
                    1000 + Math.random() * 9000
                );

                return `#${year}${month}${day}-${randomNumber}`;
            }

            function showNotification(message) {
                notification.textContent = message;
                notification.classList.add("visible");

                window.clearTimeout(
                    showNotification.timeoutId
                );

                showNotification.timeoutId = window.setTimeout(() => {
                    notification.classList.remove("visible");
                }, 2200);
            }

            function fallbackCopy(text) {
                const textarea = document.createElement("textarea");

                textarea.value = text;
                textarea.style.position = "fixed";
                textarea.style.opacity = "0";

                document.body.appendChild(textarea);

                textarea.select();
                document.execCommand("copy");
                textarea.remove();
            }
        });
    </script>
</body>
</html>
